<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>LABempresta</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' href='main.css'>
</head>
<body>
    <h1>PRODUTOS DO BACKEND</h1>

    <!-- Mensagem de feedback -->
    <div id="mensagem" style="display:none"></div>

    <!-- Formulário de cadastro/edição -->
    <div id="formulario">
        <p id="titulo-form">Cadastrar Produto</p>
        <input type="hidden" id="edit-id" value="" />
        <input type="text" id="form-nome" placeholder="Nome" />
        <input type="text" id="form-tipo" placeholder="Tipo" />
        <select id="form-status">
            <option value="disponivel">Disponível</option>
            <option value="emprestado">Emprestado</option>
            <option value="manutencao">Em Manutenção</option>
        </select>
        <input type="text" id="form-descricao" placeholder="Descrição" />
        <button onclick="salvarProduto()">Salvar</button>
        <button onclick="cancelarEdicao()">Cancelar</button>
    </div>

    <!-- Filtros -->
    <div id="filtros">
        <p>Filtros de pesquisa</p>
        <input type="text" id="nome" placeholder="Nome" />
        <select id="status">
            <option value=""> - Status - </option>
            <option value="emprestado">Emprestado</option>
            <option value="disponivel">Disponível</option>
            <option value="manutencao">Em Manutenção</option>
        </select>
        <select id="tipo">
            <option value=""> - Tipo - </option>
            <option value="notebook">Notebook</option>
            <option value="projetor">Projetor</option>
            <option value="mause">Mause</option>
            <option value="tablet">Tablet</option>
            <option value="camera">Câmera</option>
            <option value="audio">Áudio</option>
            <option value="minicomputador">Minicomputador</option>
            <option value="mouse">Mouse</option>
        </select>
        <button onclick="getProducts()">Filtrar</button>
    </div>

    <!-- Tabela -->
    <div id="produtos">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="data"></tbody>
        </table>
    </div>

    <script src='main.js'></script>
</body>
</html>
